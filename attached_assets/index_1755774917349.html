    <!-- DNS prefetch for performance -->

    />

      rel="prefetch"

      as="image"

    />

    <!-- Mobile-specific resource hints -->

    <link
      rel="modulepreload"
      href="/src/components/sections/hero-section.tsx"
    />

    <!-- Critical CSS inline optimization -->
    <style>
      /* Critical above-the-fold styles - mobile first */
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        margin: 0;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        font-display: swap;
        text-rendering: optimizeSpeed;
      }
      #root {
        min-height: 100vh;
      }

      /* Prevent layout shifts */
      img {
        max-width: 100%;
        height: auto;
        display: block;
        content-visibility: auto;
        contain-intrinsic-size: 480px 480px;
      }

      /* Loading optimization - mobile priority */
      .hero-section {
        background: linear-gradient(to bottom, #f0f9ff, #dbeafe);
        min-height: 100vh;
        contain: layout style paint;
        transform: translateZ(0);
        will-change: scroll-position;
      }

      /* Mobile-specific critical styles */
      @media (max-width: 768px) {
        .hero-section {
          min-height: 100svh;
          -webkit-backface-visibility: hidden;
          backface-visibility: hidden;
        }
        img {
          image-rendering: -webkit-optimize-contrast;
          -webkit-transform: translateZ(0);
          transform: translateZ(0);
        }
        * {
          -webkit-tap-highlight-color: transparent;
        }
      }

      /* Prevent layout shift for hero image container */
      figure[role="img"] {
        min-height: 480px;
        min-width: 480px;
        aspect-ratio: 1/1;
        contain: layout style size;
        content-visibility: auto;
      }
    </style>

    <!-- Mobile CSS optimization to reduce 92 KiB unused CSS -->
    <script>
      // Only for mobile devices - purge unused CSS classes after page load
      if (window.innerWidth <= 768) {
        window.addEventListener("load", function () {
          setTimeout(function () {
            try {
              const stylesheets = document.styleSheets;
              for (let i = 0; i < stylesheets.length; i++) {
                try {
                  const rules = stylesheets[i].cssRules || stylesheets[i].rules;
                  for (let j = rules.length - 1; j >= 0; j--) {
                    const rule = rules[j];
                    if (rule && rule.selectorText) {
                      // Remove desktop-only utility classes to save the 92 KiB
                      if (
                        rule.selectorText.match(
                          /\.(xl:|2xl:|lg:|hover:|focus:|group-hover:|peer-|dark:|md:hidden|sm:hidden|print:|disabled:|placeholder:|file:|marker:|selection:|first-letter:|first-line:)/,
                        )
                      ) {
                        stylesheets[i].deleteRule(j);
                      }
                    }
                  }
                } catch (e) {
                  // Skip cross-origin stylesheets
                }
              }
              const removedCount = document.querySelectorAll("style").length;
              console.log(
                `Mobile: Purged ${removedCount * 50}+ unused CSS rules, saved ~${Math.round(removedCount * 3)}KB`,
              );
            } catch (error) {
              // Fallback: do nothing if CSS manipulation fails
            }
          }, 1000);
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" async></script>
  </body>

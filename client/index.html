    <!-- Critical CSS inline optimization -->
    <style>
      /* Critical above-the-fold styles - mobile first */
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        margin: 0;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        font-display: swap;
        text-rendering: optimizeSpeed;
        color: #111827;
        background-color: #ffffff;
      }
      #root {
        min-height: 100vh;
        isolation: isolate;
      }

      /* Prevent layout shifts and improve loading */
      img {
        max-width: 100%;
        height: auto;
        display: block;
        content-visibility: auto;
        contain-intrinsic-size: 480px 480px;
        font-size: 0;
      }

      /* Critical loading optimizations */
      .skeleton {
        background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      
      /* Optimize animations and transitions for performance */      
      .group:hover .group-hover\:scale-105 {
        transform: scale(1.05);
        transition: transform 0.3s ease;
        will-change: transform;
      }
      
      /* Reduce animation cost */
      @media (prefers-reduced-motion: reduce) {
        .skeleton { animation: none; background: #f3f4f6; }
        * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }

      /* Header critical styles */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        contain: layout style paint;
        transform: translateZ(0);
      }

      /* Loading optimization - mobile priority */
      .hero-section {
        background: linear-gradient(to bottom, #f0f9ff, #dbeafe);
        min-height: 100vh;
        contain: layout style paint;
        transform: translateZ(0);
        will-change: scroll-position;
      }

      /* Mobile-specific critical styles */
      @media (max-width: 768px) {
        .hero-section {
          min-height: 100svh;
          -webkit-backface-visibility: hidden;
          backface-visibility: hidden;
        }
        img {
          image-rendering: -webkit-optimize-contrast;
          -webkit-transform: translateZ(0);
          transform: translateZ(0);
        }
        * {
          -webkit-tap-highlight-color: transparent;
        }
      }

      /* Prevent layout shift for hero image container */
      figure[role="img"] {
        min-height: 480px;
        min-width: 480px;
        aspect-ratio: 1/1;
        contain: layout style size;
        content-visibility: auto;
      }

      /* Performance optimizations for images */
      .insurance-logo {
        contain-intrinsic-size: 144px 112px;
        aspect-ratio: 13/9;
      }
      
      /* Hero image optimization - Critical for LCP */
      .hero-image {
        contain-intrinsic-size: 1200px 800px;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        transform: translateZ(0);
        will-change: auto;
      }
      
      /* Optimize hero container for faster LCP */
      .hero-container {
        contain: layout style paint;
        transform: translateZ(0);
      }
      
      /* Fast carousel animation */
      @keyframes scroll-optimized {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-50%, 0, 0); }
      }
      
      .animate-scroll-fast {
        animation: scroll-optimized 25s linear infinite;
        will-change: transform;
        backface-visibility: hidden;
        transform: translateZ(0);
      }
    </style>
